name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, build e regras de segurança
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # O emulador do Firestore roda sobre a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos do frontend
        run: npm run typecheck

      - name: Build do backend (Cloud Function)
        run: npm run build

      - name: Build do site
        run: npm run build:client

      - name: Testar as regras do Firestore
        run: npm run test:rules
